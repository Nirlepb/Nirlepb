<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#15162c"/>
<stop offset="50%" stop-color="#10111d"/>
<stop offset="100%" stop-color="#090b11"/>
</linearGradient>

<linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff6ec4">
<animate attributeName="stop-color"
values="#ff6ec4;#7c3aed;#00f5d4;#ff6ec4"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#00f5d4">
<animate attributeName="stop-color"
values="#00f5d4;#ff6ec4;#7c3aed;#00f5d4"
dur="8s"
repeatCount="indefinite"/>
</stop>
</linearGradient>

<linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ff6ec4"/>
<stop offset="100%" stop-color="#7c3aed"/>
</linearGradient>

<style>

text{
font-family:'Segoe UI',sans-serif;
}

.card{
fill:url(#bg);
stroke:url(#border);
stroke-width:3;
}

.row{
opacity:0;
animation:fade .7s forwards;
}

.r1{animation-delay:.2s;}
.r2{animation-delay:.5s;}
.r3{animation-delay:.8s;}
.r4{animation-delay:1.1s;}

@keyframes fade{
from{
opacity:0;
transform:translateY(12px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.chip{
opacity:0;
animation:pop .4s forwards;
}

@keyframes pop{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>

</defs>

<!-- Background -->

<rect x="3" y="3"
width="514"
height="384"
rx="24"
class="card"/>

<!-- Floating Particles -->

<circle cx="485" cy="40" r="3" fill="#ff6ec4">
<animate attributeName="cy"
values="40;25;40"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="40" cy="345" r="3" fill="#00f5d4">
<animate attributeName="cy"
values="345;330;345"
dur="2.8s"
repeatCount="indefinite"/>
</circle>

<circle cx="470" cy="210" r="2" fill="#ffd93d">
<animate attributeName="opacity"
values=".2;1;.2"
dur="2s"
repeatCount="indefinite"/>
</circle>

<!-- Heading -->


<text x="35"
y="73"
font-size="14"
fill="#8b949e">
Java • AI • Full Stack Developer
</text>

<line x1="35"
y1="92"
x2="485"
y2="92"
stroke="#30363d"/>

<!-- ROLE -->

<g class="row r1">

<circle cx="40" cy="120" r="17"
fill="#7c3aed22"/>

<text x="32" y="125" font-size="17">💼</text>

<text x="70"
y="120"
font-size="18"
font-weight="700"
fill="#b388ff">
Role
</text>

<text x="70"
y="145"
font-size="16"
fill="#d0d7de">
Java Developer • Full Stack • AI
</text>

</g>

<!-- EDUCATION -->

<g class="row r2">

<circle cx="40" cy="190" r="17"
fill="#00f5d422"/>

<text x="31" y="195" font-size="17">🎓</text>

<text x="70"
y="190"
font-size="18"
font-weight="700"
fill="#00f5d4">
Education
</text>

<text x="70"
y="215"
font-size="16"
fill="#d0d7de">
B.Tech CSE @ Amrita Vishwa Vidyapeetham
</text>

</g>

<!-- SKILLS -->

<g class="row r3">

<circle cx="40" cy="260" r="17"
fill="#ff9f4322"/>

<text x="31" y="265" font-size="17">⚡</text>

<text x="70"
y="260"
font-size="18"
font-weight="700"
fill="#ff9f43">
Skills
</text>

<g transform="translate(70 280)">

<rect class="chip"
x="0"
y="0"
rx="14"
width="72"
height="28"
fill="#15162c"
stroke="#ff9f43"
style="animation-delay:1.2s"/>

<text class="chip"
x="36"
y="19"
font-size="13"
fill="#ffcf99"
text-anchor="middle"
style="animation-delay:1.2s">
Java
</text>

<rect class="chip"
x="82"
y="0"
rx="14"
width="62"
height="28"
fill="#15162c"
stroke="#ff6ec4"
style="animation-delay:1.35s"/>

<text class="chip"
x="113"
y="19"
font-size="13"
fill="#ffc2e8"
text-anchor="middle"
style="animation-delay:1.35s">
DSA
</text>

<rect class="chip"
x="154"
y="0"
rx="14"
width="82"
height="28"
fill="#15162c"
stroke="#00f5d4"
style="animation-delay:1.5s"/>

<text class="chip"
x="195"
y="19"
font-size="13"
fill="#9effeb"
text-anchor="middle"
style="animation-delay:1.5s">
Python
</text>

</g>

</g>

<!-- CERTIFICATION -->

<g class="row r4">

<circle cx="40" cy="340" r="17"
fill="#ffd93d22"/>

<text x="31" y="345" font-size="17">🏆</text>

<text x="70"
y="340"
font-size="18"
font-weight="700"
fill="#ffd93d">
Certification
</text>

<text x="70"
y="365"
font-size="16"
fill="#d0d7de">
Oracle Java Foundations
</text>

</g>

</svg>